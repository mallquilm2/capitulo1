<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Página con formulario</title>
    <link href="laboratorio06.css" type="text/css" rel="stylesheet">
</head>
<body>
<form action="#" method="post" class="formal">
  <fieldset>
  <legend>Nuevo Producto</legend>
  <table style="margin:auto" class="main">
    <tr>
      <td>Nombre Producto</td>
      <td><input type="text" name="titulo" style="width:300px"></td>
    </tr>
    <tr>
      <td>Tipo</td>
      <td>
        <select name="tipo" style="width:305px">
          <option value="Separata">Separata</option>
          <option value="Video">Video</option>
        </select>
      </td>
    </tr>
    <tr>
      <td>Precio</td>
      <td>
        <input type="text" name="precio" style="width:150px; text-align:right">
      </td>
    </tr>
    <tr>
      <td colspan="3" style="text-align:center">
        <input type="submit" value="Enviar datos">
      </td>
    </tr>
  </table>
  </fieldset>
</form>
</body>
</html>
